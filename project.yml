# Xcode-Projekt erzeugen mit:  xcodegen generate
# (Installation: brew install xcodegen)
name: CouchRemote

options:
  bundleIdPrefix: at.diego.couchremote
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  # Deutsch als Entwicklungssprache (Datumsformate, Systemtexte)
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 8K6F5K4NXG
    CODE_SIGN_STYLE: Automatic

packages:
  RemoteKit:
    path: RemoteKit

targets:
  # iPhone-Fernbedienung
  CouchRemote:
    type: application
    platform: iOS
    sources: [RemoteApp]
    dependencies:
      - package: RemoteKit
    info:
      path: RemoteApp/Info.plist
      properties:
        CFBundleDisplayName: CouchRemote
        CFBundleDevelopmentRegion: de
        # 120 Hz (ProMotion) statt der 60-Hz-Grenze für Apps: doppelt so viele Trackpad-Updates
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: CouchRemote sucht deinen Mac im Heimnetz, um ihn fernzusteuern.
        NSBonjourServices: [_couchremote._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.diego.couchremote.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Mac-Host (läuft am Sony)
  CouchHost:
    type: application
    platform: macOS
    sources: [HostApp]
    dependencies:
      - package: RemoteKit
    info:
      path: HostApp/Info.plist
      properties:
        CFBundleDisplayName: CouchHost
        CFBundleDevelopmentRegion: de
        # App Nap aus: sonst drosselt macOS CouchHost im Hintergrund und der Zeiger hängt
        NSAppSleepDisabled: true
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: CouchHost empfängt Befehle von deinem iPhone im Heimnetz.
        NSBonjourServices: [_couchremote._tcp]
    entitlements:
      path: HostApp/CouchHost.entitlements
      properties:
        # Kein Sandbox: CGEvent-Eingaben an andere Apps (Safari) sind im Sandbox nicht erlaubt.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.diego.couchremote.host
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  RemoteKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [RemoteKit/Tests/RemoteKitTests]
    dependencies:
      - package: RemoteKit
